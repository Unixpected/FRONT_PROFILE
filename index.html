<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unixpected</title>
<meta name="description" content="unixpected — I build small, useful things.">
<style>
  :root { --bg:#0b1512; --ink:#e6f0ec; --muted:#8fa69c; --accent:#4cc79b; --line:#22352e; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; background:var(--bg); color:var(--ink); font:18px/1.6 Georgia,"Times New Roman",serif; }
  .photo { width:25vw; min-width:220px; height:100vh; position:sticky; top:0; flex:none; background:#14211d; }
  .photo img { width:100%; height:100%; object-fit:cover; display:block; }
  main { flex:1; display:flex; flex-direction:column; justify-content:center; padding:48px clamp(24px,6vw,96px); max-width:820px; }
  .tag { color:var(--accent); letter-spacing:.12em; text-transform:uppercase; font-size:.8rem; }
  h1 { font-size:clamp(2.4rem,6vw,4rem); margin:8px 0 12px; line-height:1.05; }
  p { color:var(--muted); margin:0 0 24px; max-width:34em; }
  .links { display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; }
  a.btn { padding:12px 20px; border:1px solid var(--line); border-radius:10px; color:var(--ink); text-decoration:none; }
  a.btn.primary { background:var(--accent); border-color:var(--accent); color:#06231a; font-weight:bold; }
  a.btn:hover { border-color:var(--accent); }
  footer { margin-top:56px; color:var(--muted); font-size:.85rem; }
  footer a { color:var(--muted); }
  @media (max-width:700px) {
    body { flex-direction:column; height:auto; }
    .photo { width:100%; height:25vh; position:static; }
    main { padding:32px 24px 48px; }
  }
</style>
</head>
<body>
  <div class="photo">
    <!-- Save your picture next to this file as profile.jpg for best reliability -->
    <img src="profile.jpg" alt="unixpected" referrerpolicy="no-referrer"
         onerror="this.onerror=null;this.src='https://i.redd.it/oiv9dqepfbnb1.jpg'">
  </div>
  <main>
    <div class="tag">unixpected05.online</div>
    <h1>Hi, I'm unixpected.</h1>
    <p>I make small, simple tools that make everyday things easier. Have a question or an idea? Send me a message.</p>
    <div class="links">
      <a class="btn primary" href="mailto:unixpected@proton.me">unixpected@proton.me</a>
      <a class="btn" href="https://unixpected.github.io/SHARE_FILE_ONLINE/">Send a file</a>
    </div>
    <footer>&copy; <span id="y"></span> unixpected</footer>
  </main>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
